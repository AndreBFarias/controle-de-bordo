name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + Formato
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements-ci.txt

      - name: Ruff check
        run: ruff check src/

      - name: Ruff format (verificar)
        run: ruff format --check src/

  tests:
    name: Testes E2E
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements-ci.txt

      - name: Executar testes E2E
        run: python -m pytest tests/e2e/ -v --tb=short

      - name: Cobertura
        if: always()
        run: python -m pytest tests/e2e/ --cov=src --cov-report=term-missing || true
