name: Quality Gates

on:
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate-lint:
    name: Gate - Lint (Bloqueante)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements-ci.txt

      - name: Ruff check (zero erros)
        run: ruff check src/ --output-format=github

      - name: Ruff format (zero desvios)
        run: ruff format --check src/

  gate-tests:
    name: Gate - Testes E2E (Bloqueante)
    runs-on: ubuntu-latest
    needs: gate-lint
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements-ci.txt

      - name: Testes E2E (100% devem passar)
        run: python -m pytest tests/e2e/ -v --tb=short --strict-markers

      - name: Relatório de cobertura
        if: always()
        run: |
          python -m pytest tests/e2e/ --cov=src --cov-report=term-missing --cov-fail-under=30 || true

  gate-registry:
    name: Gate - Registry (Bloqueante)
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      - name: Verificar REGISTRY.csv
        run: |
          python3 scripts/hooks/check_registry.py $(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files) || echo "Novos arquivos precisam de registro"
