[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "controle-de-bordo"
version = "0.1.0"
description = "Life Operating System open source, local-first, focado no contexto brasileiro."
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10"
authors = [
    {name = "Comunidade Controle de Bordo"}
]
keywords = ["life-os", "personal-finance", "automation", "local-first", "brazil"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Home Automation",
    "Natural Language :: Portuguese (Brazilian)",
]

dependencies = [
    "pydantic>=2.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13.0"]
luna = []
flet = ["flet>=0.80"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.4.0",
]
all = ["controle-de-bordo[cli,flet]"]

[project.scripts]
bordo = "bordo.cli:app"

[project.entry-points."luna.modules"]
controle-de-bordo = "bordo.plugin:BordoLunaPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/bordo"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    "venv",
    ".venv",
    ".git",
    "__pycache__",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    "E722",
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = [
    "venv",
    ".venv",
    "data",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "e2e: Testes end-to-end unificados",
    "slow: Testes que demoram mais de 10s",
]
