[project]
name = "controle-de-bordo"
version = "0.1.0"
description = "Life Operating System open source, local-first, focado no contexto brasileiro. Gestão financeira, hábitos, saúde e automação pessoal."
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10"
authors = [
    {name = "Comunidade Controle de Bordo"}
]
keywords = ["life-os", "personal-finance", "automation", "local-first", "brazil"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Home Automation",
    "Natural Language :: Portuguese (Brazilian)",
]

dependencies = [
    # UI
    "flet>=0.82.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.0.0",
    # Validação
    "pydantic>=2.5.0",
    # Dados financeiros BR
    "finbr>=0.3.0",
    "python-bcb>=0.3.0",
    # Parser OFX
    "ofxparse>=0.21",
    # Processamento de dados
    "polars>=1.0.0",
    # Monitoramento de arquivos
    "watchdog>=4.0.0",
    # Notificações push
    "httpx>=0.27.0",
    # Configuração
    "python-dotenv>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
ai-cloud = [
    "anthropic>=0.40.0",
]
ai-local = [
    "ollama>=0.4.0",
]
desktop = [
    "dasbus>=1.7",
    "psutil>=5.9.0",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
bordo = "src.cli.main:app"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    "venv",
    ".venv",
    ".git",
    "__pycache__",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    "E722",
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = [
    "venv",
    ".venv",
    "data",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "e2e: Testes end-to-end unificados",
    "slow: Testes que demoram mais de 10s",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"
